<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Tall Order</title>
    <meta name="description" content="A physics stacking game built from Vi3W-generated 3D models." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <!-- Loading -->
    <section id="loading" class="screen show">
      <div class="logo">TALL<br />ORDER</div>
      <div class="bar"><span id="load-fill"></span></div>
      <p class="muted">Unpacking Vi3W models…</p>
    </section>

    <!-- Title -->
    <section id="title" class="screen">
      <div class="title-top">
        <div class="logo">TALL<br />ORDER</div>
        <p class="tag">Stack the strangest things as high as you dare.</p>
      </div>
      <div class="title-bottom">
        <div class="buttons">
          <button id="btn-play" class="btn primary">Play</button>
        </div>
        <p class="best">Best tower: <b id="best-title">0.00 m</b></p>
        <div class="howto">
          <p><b>Move</b> mouse / drag &nbsp;·&nbsp; <b>Drop</b> click / Space</p>
          <p><b>Spin</b> Q E / wheel &nbsp;·&nbsp; <b>Tip</b> R F &nbsp;·&nbsp; <b>Orbit</b> A D</p>
        </div>
      </div>
    </section>

    <!-- HUD -->
    <section id="hud" class="hidden">
      <div class="hud-top">
        <div class="stat">
          <span class="label">Tower</span>
          <span class="value" id="height">0.00 m</span>
        </div>
        <div class="stat center">
          <span class="label">Wobbles left</span>
          <span class="value lives" id="lives"></span>
        </div>
        <div class="stat right">
          <span class="label">Next</span>
          <img id="next-thumb" alt="" />
        </div>
      </div>
      <div id="toast"></div>
      <div id="gust" class="hidden"><span id="gust-arrow">➜</span> Gust!</div>
      <div class="hud-actions">
        <button id="btn-colliders" class="chip" title="Show colliders (H)">Colliders</button>
        <button id="btn-mute" class="chip" title="Mute (M)">Sound on</button>
      </div>
      <div class="touch">
        <button data-act="orbitL" aria-label="Orbit left">⟲</button>
        <button data-act="spin" aria-label="Spin piece">↻</button>
        <button data-act="tip" aria-label="Tip piece">⤵</button>
        <button data-act="drop" class="drop" aria-label="Drop piece">DROP</button>
        <button data-act="orbitR" aria-label="Orbit right">⟳</button>
      </div>
    </section>

    <!-- Game over -->
    <section id="over" class="screen">
      <h2 id="over-title">Timber!</h2>
      <p class="big"><span id="over-height">0.00</span> m</p>
      <p class="muted"><span id="over-pieces">0</span> pieces stacked · best <span id="over-best">0.00</span> m</p>
      <div class="buttons">
        <button id="btn-again" class="btn primary">Stack again</button>
        <button id="btn-share" class="btn">Copy score</button>
        <button id="btn-menu" class="btn ghost">Menu</button>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
